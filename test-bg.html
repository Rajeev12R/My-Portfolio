<!DOCTYPE html>
<html>
<head>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #fdfdfd;
      font-family: sans-serif;
    }
    .mesh-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fff;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
    }
    .blob-1 { top: -10%; left: -10%; width: 50%; height: 50%; background: rgba(220, 230, 255, 0.8); }
    .blob-2 { top: 20%; right: -10%; width: 40%; height: 50%; background: rgba(255, 230, 210, 0.8); }
    .blob-3 { bottom: -10%; left: 20%; width: 40%; height: 40%; background: rgba(210, 255, 230, 0.6); }
    .blob-4 { bottom: 10%; right: 20%; width: 30%; height: 40%; background: rgba(240, 220, 255, 0.8); }
    
    .pattern-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='4' y='4' width='72' height='72' rx='16' fill='rgba(255,255,255,0.1)' stroke='rgba(255,255,255,0.5)' stroke-width='1.5'/%3E%3C/svg%3E");
      mask-image: radial-gradient(ellipse at center, black 10%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 10%, transparent 80%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="mesh-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="pattern-overlay"></div>
  </div>
</body>
</html>
