<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #111; margin: 0; padding: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh;}
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(24, 100px);
      grid-template-rows: repeat(14, 100px);
      width: 2400px;
      height: 1400px;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    .grid-cell {
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
    }

    .glossy-square {
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1.5px solid rgba(255, 255, 255, 0.4);
      border-left: 1.5px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="grid-container" id="grid">
    <!-- populated by JS -->
  </div>
  <script>
    const container = document.getElementById('grid');
    const glossyCells = new Set([
      "2,3", "3,3", "5,3",
      "2,4", "3,4", "4,4", "6,4",
      "3,5", "4,5", "5,5",
      "2,6", "4,6", "5,6",
      "3,7", "4,7",
      "2,8", "3,8", "4,8", "5,8",
      "3,9", "4,9",
      "2,10", "3,10", "5,10",

      "18,3", "20,3", "21,3",
      "17,4", "19,4", "20,4", "21,4",
      "18,5", "19,5", "20,5",
      "18,6", "19,6", "21,6",
      "19,7", "20,7",
      "18,8", "19,8", "20,8", "21,8",
      "19,9", "20,9",
      "18,10", "20,10", "21,10"
    ]);

    for (let y = 0; y < 14; y++) {
      for (let x = 0; x < 24; x++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        if (glossyCells.has(`${x},${y}`)) {
          const glossy = document.createElement('div');
          glossy.className = 'glossy-square';
          cell.appendChild(glossy);
        }
        container.appendChild(cell);
      }
    }
  </script>
</body>
</html>
