<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #333; margin: 0; padding: 50px; font-family: sans-serif; }
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 120px);
      grid-template-rows: repeat(4, 120px);
      position: relative;
    }

    /* Faint straight lines */
    .grid-cell {
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    
    /* Top and left borders for the whole grid to complete the lines */
    .grid-container {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Glossy rounded square inside the cell */
    .glossy-square {
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px; /* overlap the cell borders */
      border-radius: 24px; /* big rounded corners */
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: rgba(255, 255, 255, 0.6);
      border-left-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
      z-index: 1; /* sit above the faint grid lines */
    }

    /* Optional: To make the faint lines visible at the corners where the glossy square curves in */
    .grid-cell { overflow: visible; }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="grid-cell"></div>
    <div class="grid-cell"><div class="glossy-square"></div></div>
    <div class="grid-cell"><div class="glossy-square"></div></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    
    <div class="grid-cell"><div class="glossy-square"></div></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"><div class="glossy-square"></div></div>
    <div class="grid-cell"></div>
    
    <div class="grid-cell"><div class="glossy-square"></div></div>
    <div class="grid-cell"><div class="glossy-square"></div></div>
    <div class="grid-cell"><div class="glossy-square"></div></div>
    <div class="grid-cell"><div class="glossy-square"></div></div>
    <div class="grid-cell"><div class="glossy-square"></div></div>
  </div>
</body>
</html>
