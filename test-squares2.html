<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #333; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
    .box { width: 400px; height: 400px; border: 1px solid red; position: relative; }
    
    /* Attempt E: Joined Top-Left, Bottom-Right. Gaps at Top-Right, Bottom-Left */
    .patternE {
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 80 10 L 10 10 L 10 80 M 20 90 L 90 90 L 90 20' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E");
    }

    /* Attempt F: Joined Top-Left, Bottom-Right, with rounded corners. Gaps at Top-Right, Bottom-Left */
    .patternF {
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 80 10 L 30 10 A 20 20 0 0 0 10 30 L 10 80 M 20 90 L 70 90 A 20 20 0 0 0 90 70 L 90 20' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E");
    }

    /* Attempt G: Continuous lines that have gaps exactly at diagonal intersections */
    .patternG {
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 0 10 H 40 M 60 10 H 100 M 10 0 V 40 M 10 60 V 100' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>
  <div class="box patternE"></div>
  <div class="box patternF"></div>
  <div class="box patternG"></div>
</body>
</html>
