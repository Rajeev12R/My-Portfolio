<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #333; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
    .box { width: 400px; height: 400px; border: 1px solid red; position: relative; }
    
    /* Attempt A: Top line continues right, Right line continues top */
    .patternA {
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 100 10 L 30 10 A 20 20 0 0 0 10 30 L 10 100 M 0 90 L 70 90 A 20 20 0 0 0 90 70 L 90 0' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E");
    }

    /* Attempt B: Gap at top-right and bottom-left, but line doesn't connect across */
    .patternB {
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 80 10 L 30 10 A 20 20 0 0 0 10 30 L 10 80 M 20 90 L 70 90 A 20 20 0 0 0 90 70 L 90 20' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E");
    }
    
    /* Attempt C: Like A, but connected to form continuous diagonal stairs */
    .patternC {
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 10 100 L 10 30 A 20 20 0 0 1 30 10 L 100 10 M 0 90 L 70 90 A 20 20 0 0 0 90 70 L 90 0' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E");
    }

    /* Attempt D: Diagonal cross */
    .patternD {
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 10 100 V 30 A 20 20 0 0 1 30 10 H 100 M -10 90 H 70 A 20 20 0 0 0 90 70 V -10' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>
  <div class="box patternA"></div>
  <div class="box patternB"></div>
  <div class="box patternC"></div>
  <div class="box patternD"></div>
</body>
</html>
