<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #333; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
    .box { width: 400px; height: 400px; border: 1px solid red; position: relative; }
    
    /* Attempt 5: Overlapping squares */
    .pattern5 {
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='0' width='40' height='40' rx='10' fill='none' stroke='white' stroke-width='2'/%3E%3Crect x='30' y='30' width='40' height='40' rx='10' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E");
    }

    /* Attempt 6: Squares with missing segments (dashed stroke) */
    .pattern6 {
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='4' y='4' width='72' height='72' rx='20' fill='none' stroke='white' stroke-width='2' stroke-dasharray='20 40 40 20'/%3E%3C/svg%3E");
    }

    /* Attempt 7: A path that forms a continuous maze-like grid */
    .pattern7 {
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 20 0 V 20 Q 20 40 40 40 H 80 M 0 60 H 40 Q 60 60 60 80' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E");
    }

    /* Attempt 8: Four L shapes in a square */
    .pattern8 {
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 10 40 V 20 Q 10 10 20 10 H 40 M 70 40 V 20 Q 70 10 60 10 H 40 M 10 40 V 60 Q 10 70 20 70 H 40 M 70 40 V 60 Q 70 70 60 70 H 40' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>
  <div class="box pattern5"></div>
  <div class="box pattern6"></div>
  <div class="box pattern7"></div>
  <div class="box pattern8"></div>
</body>
</html>
