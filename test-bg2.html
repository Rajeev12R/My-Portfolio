<!DOCTYPE html>
<html>
<head>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #fffaf9;
      font-family: sans-serif;
    }
    .mesh-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fff;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
    }
    /* peachy, orange, violet, mint */
    .blob-1 { top: -10%; left: 10%; width: 50%; height: 50%; background: rgba(255, 218, 185, 0.8); }
    .blob-2 { top: 20%; right: -10%; width: 45%; height: 55%; background: rgba(230, 215, 255, 0.8); }
    .blob-3 { bottom: -10%; left: -10%; width: 50%; height: 50%; background: rgba(200, 240, 255, 0.7); }
    .blob-4 { bottom: 10%; right: 20%; width: 30%; height: 40%; background: rgba(255, 230, 210, 0.7); }
    .blob-5 { top: 40%; left: 30%; width: 40%; height: 40%; background: rgba(255, 255, 255, 0.5); }
    
    .pattern-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='4' y='4' width='92' height='92' rx='24' fill='rgba(255,255,255,0.2)' stroke='rgba(255,255,255,0.7)' stroke-width='1.5'/%3E%3C/svg%3E");
      mask-image: radial-gradient(ellipse at center, black 15%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 15%, transparent 70%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="mesh-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-5"></div>
    <div class="pattern-overlay"></div>
  </div>
</body>
</html>
